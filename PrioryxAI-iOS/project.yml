# XcodeGen spec — generates PrioryxAI.xcodeproj.
#
# This repo previously had NO Xcode project at all: Package.swift only
# declared a *library* target, so there was nothing to open, build, sign, or
# run as an app. This file defines a real application target that compiles
# the same Swift sources directly (not through the SPM library product,
# which would create a redundant/awkward @main-in-a-library setup) and links
# the four remote SPM dependencies the code actually imports.
#
# Usage (on a Mac, with XcodeGen installed — `brew install xcodegen`):
#   cd PrioryxAI-iOS
#   xcodegen generate
#   open PrioryxAI.xcodeproj
# Then in Xcode: select the PrioryxAI target > Signing & Capabilities > pick
# your team, and set a unique bundle id if `in.prioryxai.app` is already
# taken under a different Apple Developer account.

name: PrioryxAI
options:
  bundleIdPrefix: in.prioryxai
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.4.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.11.0

targets:
  PrioryxAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrioryxAI
        excludes:
          - "Info.plist"
    info:
      path: PrioryxAI/Info.plist
      properties: {}
    entitlements:
      path: PrioryxAI/PrioryxAI.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.prioryxai.app
        PRODUCT_NAME: PrioryxAI
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1; add "2" for iPad once layouts are verified on that size
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Supabase
        product: Supabase
      - package: MarkdownUI
        product: MarkdownUI
      - package: Lottie
        product: Lottie
      - package: Kingfisher
        product: Kingfisher
